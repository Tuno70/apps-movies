<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TUNO SISTEMAS - Descarga</title>
    <!-- Incluimos Tailwind CSS para los estilos modernos y responsivos -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Animación suave para el fondo */
        body {
            background: linear-gradient(135deg, #f3f4f6 0%, #e5e7eb 100%);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 font-sans text-gray-800">

    <!-- Contenedor principal estilo tarjeta -->
    <div class="bg-white rounded-3xl shadow-xl p-8 max-w-sm w-full text-center border border-gray-100">
        
        <!-- Título de tu marca -->
        <h1 class="text-3xl font-extrabold tracking-tight text-gray-900 mb-8 uppercase">
            TUNO SISTEMAS
        </h1>

        <!-- Información de la App -->
        <div class="mb-8">
            <!-- Ícono decorativo de una app móvil -->
            <div class="w-24 h-24 mx-auto bg-blue-50 text-blue-600 rounded-2xl flex items-center justify-center mb-4 shadow-sm border border-blue-100">
                <svg class="w-12 h-12" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 18h.01M8 21h8a2 2 0 002-2V5a2 2 0 00-2-2H8a2 2 0 00-2 2v14a2 2 0 002 2z"></path>
                </svg>
            </div>
            
            <h2 class="text-xl font-bold text-gray-800">PELICULAS, SERIES Y TV</h2>
        </div>

        <!-- Botón de Descarga actualizado para Fire TV -->
        <a href="Xuper_TV (1).apk" download="Xuper_TV (1).apk" target="_blank" onclick="forzarDescarga(event, this.href)"
           class="group relative inline-flex items-center justify-center w-full px-6 py-4 text-base font-semibold text-white bg-blue-600 rounded-xl hover:bg-blue-700 focus:outline-none focus:ring-4 focus:ring-blue-300 transition-all duration-200 ease-in-out shadow-md hover:shadow-lg active:scale-95">
            
            <!-- Ícono de flecha de descarga -->
            <svg class="w-6 h-6 mr-2 transition-transform group-hover:-translate-y-1" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path>
            </svg>
            DESCARGAR
        </a>

        <!-- Nota informativa inferior -->
        <p class="mt-5 text-xs text-gray-400">
            Asegúrate de permitir la instalación de orígenes desconocidos en tu dispositivo Android.
        </p>

    </div>

    <script>
        // Función para forzar la descarga en navegadores restrictivos como los de Fire TV
        function forzarDescarga(e, url) {
            // Intentamos redirigir la ventana directamente al archivo después de un pequeño retraso.
            // A veces esto engaña al WebView del Fire TV para que lance su gestor de descargas.
            setTimeout(function() {
                window.location.href = url;
            }, 150);
        }
    </script>
</body>
</html>
